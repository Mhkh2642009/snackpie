{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<section class="section" style="text-align: center; min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center;">
  <div style="font-size: 6rem; margin-bottom: var(--space-4);">🔥</div>
  <h1 style="font-family: var(--font-display); font-size: var(--text-4xl); margin-bottom: var(--space-4);">500 - Kitchen Fire!</h1>
  <p style="font-size: var(--text-lg); color: var(--color-text-secondary); max-width: 50ch; margin-bottom: var(--space-8);">
    Oh no! Something went wrong in the SnackPie kitchen. Our chefs are working to fix it! 🔧
  </p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">🏠 Back to Home</a>
</section>
{% endblock %}
